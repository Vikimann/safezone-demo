
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAFEZONE – Nürnberg & Fürth</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #14263d;
    }
    header {
      background: #14263d;
      color: white;
      padding: 20px;
    }
    h1 { margin: 0; }
    main { padding: 12px; }
    #map {
      height: 65vh;
      min-height: 350px;
      border-radius: 12px;
    }
    .info {
      background: white;
      padding: 16px;
      margin-top: 12px;
      border-radius: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header>
    <h1>SAFEZONE</h1>
    <p>Pilotregion Nürnberg–Fürth</p>
  </header>

  <main>
    <div id="map"></div>

    <div class="info">
      <h2>Unsere Pilotregion</h2>
      <p>Städte: Nürnberg und Fürth</p>
      <p>
        Die amtlichen Bezirksgrenzen
        werden als Nächstes eingebunden.
      </p>
      <p>
        Noch keine kleinräumigen
        Kriminalitätsdaten verfügbar.
        Es werden keine Werte geschätzt.
      </p>
      <small>
        SAFEZONE-Prototyp.
        Keine offizielle Polizei-App.
      </small>
    </div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>
    const map = L.map("map").setView(
      [49.46, 11.03], 12
    );

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; OpenStreetMap-Mitwirkende'
      }
    ).addTo(map);

    L.marker([49.4521, 11.0767])
      .addTo(map)
      .bindPopup("Nürnberg – Pilotstadt");

    L.marker([49.4771, 10.9887])
      .addTo(map)
      .bindPopup("Fürth – Pilotstadt");
 
    // SAFEZONE: Amtliche Nürnberger Bezirksgrenzen
    fetch("safezone_nuernberg_87_bezirke.geojson")
      .then(response => {
        if (!response.ok) {
          throw new Error("Bezirksdatei nicht gefunden");
        }
        return response.json();
      })
      .then(data => {
        const bezirke = L.geoJSON(data, {
          style: {
            color: "#1769aa",
            weight: 2,
            fillColor: "#45a3e5",
            fillOpacity: 0.12
          },
          onEachFeature: (feature, layer) => {
            const props = feature.properties || {};

            const name =
              props.NAME ||
              props.BEZ_NAME ||
              props.BEZIRK ||
              props.name ||
              "Statistischer Bezirk";

            layer.bindPopup(
              "<strong>" + String(name).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + "</strong><br>" +
              "Nürnberg<br>" +
              "Keine kleinräumigen Kriminalitätsdaten hinterlegt."
            );
          }
        }).addTo(map);
      })
      .catch(error => {
        console.error("SAFEZONE:", error);
      });
 </script>
</body>
</html>
